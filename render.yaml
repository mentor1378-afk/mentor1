services:
  - type: web
    name: simats-mentees
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: DATABASE_URL
        sync: false  # You will set this manually in the Render dashboard
      - key: CLOUDINARY_URL
        sync: false  # You will set this manually in the Render dashboard
      - key: SECRET_KEY
        generateValue: true  # Render auto-generates a random secret
      - key: PORT
        value: 5000
