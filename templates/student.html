<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Portal | SIMATS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body class="bg-[#0a0c10] text-white flex items-center justify-center min-h-screen">
    <div class="glass p-10 text-center max-w-md w-full">
        <h1 class="text-2xl font-black font-outfit text-white mb-2">Student Dashboard</h1>
        <p class="text-gray-400 text-sm mb-6">Welcome, {{ student.name or student.reg_num }}</p>
        <div class="p-4 bg-blue-500/10 text-blue-400 rounded-xl text-xs font-semibold mb-6">
            Ready to build new Student UI
        </div>
        <a href="/logout" class="btn-primary inline-block px-6 py-2 text-xs">Logout</a>
    </div>
    <script>lucide.createIcons();</script>
</body>

</html>
